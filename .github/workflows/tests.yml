# Runs the test suite on GitHub's computers on every push and pull request.
# Results: the "Actions" tab of the repository, and a check mark next to each commit.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04  # a fixed version, so an OS upgrade can't break the run by surprise
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip  # reuse downloaded packages between runs

      - name: Install system libraries needed by OpenCV and MediaPipe
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libgles2

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          # CPU-only PyTorch (much smaller than the default GPU build)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run the tests
        run: python -m pytest -v
